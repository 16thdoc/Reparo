name: Steam and Headless safety checks
on:
  pull_request:
    paths:
      - 'Reparo.ps1'
      - 'Tests/Test-ReparoSteamHeadless.ps1'
      - 'Tests/Test-ReparoSteamClient.ps1'
      - 'Tests/Test-ReparoFlexibleScheduling.ps1'
      - 'Tests/Test-ReparoOneShotWorkerBinding.ps1'
      - '.github/workflows/test-steam-headless.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Steam integration regression
        shell: powershell
        run: .\Tests\Test-ReparoSteamHeadless.ps1
      - name: Steam client session-safety regression
        shell: powershell
        run: |
          try {
            .\Tests\Test-ReparoSteamClient.ps1
            if (-not $?) { throw 'Steam client regression failed' }
            exit 0
          } catch {
            Write-Error $_
            exit 1
          }
      - name: Existing scheduling regression
        shell: powershell
        run: |
          try {
            .\Tests\Test-ReparoFlexibleScheduling.ps1
            if (-not $?) { throw 'Scheduling regression failed' }
            exit 0
          } catch {
            Write-Error $_
            exit 1
          }
      - name: Generated one-shot worker binding regression
        shell: powershell
        run: |
          try {
            .\Tests\Test-ReparoOneShotWorkerBinding.ps1
            if (-not $?) { throw 'One-shot worker binding regression failed' }
            exit 0
          } catch {
            Write-Error $_
            exit 1
          }
  native-installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Native syntax and isolated installer fixtures
        run: |
          sh -n linux/reparo-linux
          sh -n deploy/install-reparo-linux.sh
          sh linux/reparo-linux --version
          sh Tests/test-reparo-linux-installer.sh
      - name: Pinned HTTPS install and self-update with isolated state and mocked cron
        shell: bash
        run: |
          set -euo pipefail
          sandbox=$(mktemp -d)
          trap 'rm -rf -- "$sandbox"' EXIT
          mkdir -p "$sandbox/bin" "$sandbox/home" "$sandbox/tmp"
          printf '%s\n' '7 7 * * * echo retained-unrelated-job' > "$sandbox/crontab"
          cat > "$sandbox/bin/crontab" <<'EOF'
          #!/usr/bin/env sh
          if [ "${1:-}" = -l ]; then
            cat "$REPARO_PILOT_CRON"
          else
            cp "$1" "$REPARO_PILOT_CRON"
          fi
          EOF
          chmod +x "$sandbox/bin/crontab"
          pilot_env=(env "HOME=$sandbox/home" "XDG_DATA_HOME=$sandbox/data" "XDG_STATE_HOME=$sandbox/state" "TMPDIR=$sandbox/tmp" "PATH=$sandbox/bin:$PATH" "REPARO_PILOT_CRON=$sandbox/crontab" "REPARO_RELEASE_URL=https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$GITHUB_SHA/deploy/reparo-release.json")
          "${pilot_env[@]}" sh deploy/install-reparo-linux.sh --verbose
          "${pilot_env[@]}" "$sandbox/home/.local/bin/reparo" --version
          "${pilot_env[@]}" "$sandbox/home/.local/bin/reparo" --new
          grep -q 'retained-unrelated-job' "$sandbox/crontab"
          test "$(grep -c '# Reparo self-update task$' "$sandbox/crontab")" -eq 1
